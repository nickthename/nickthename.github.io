<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" role="img" aria-labelledby="title desc">
  <title id="title">Yoshi armor break table</title>
  <desc id="desc">A miniature excerpt of Luigi's armor break percentages.</desc>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { fill: #f6f3f7; font-size: 24px; font-weight: bold; }
    .heading { fill: #f6f3f7; font-size: 13px; font-weight: bold; }
    .cell { fill: #555; font-size: 14px; font-weight: bold; }
    .number { text-anchor: middle; }
  </style>

  <rect width="580" height="55" fill="#418a95"/>
  <text class="title" x="20" y="36">Luigi</text>

  <rect y="55" width="580" height="35" fill="#63acb7"/>
  <text class="heading" x="20" y="78">Move</text>
  <text class="heading number" x="220" y="78">Fresh</text>
  <text class="heading number" x="300" y="78">Stale 1</text>
  <text class="heading number" x="380" y="78">Stale 2</text>
  <text class="heading number" x="460" y="78">Stale 3</text>
  <text class="heading number" x="540" y="78">Fully</text>

  <rect y="90" width="580" height="43" fill="#d4d1d5"/>
  <text class="cell" x="20" y="117">Up B (Grounded)</text>
  <text class="cell number" x="220" y="117">1</text>
  <text class="cell number" x="300" y="117">3</text>
  <text class="cell number" x="380" y="117">5</text>
  <text class="cell number" x="460" y="117">9</text>
  <text class="cell number" x="540" y="117">14</text>

  <rect y="133" width="580" height="43" fill="#e5e2e6"/>
  <text class="cell" x="20" y="160">Down B (Ground)</text>
  <text class="cell number" x="220" y="160">40</text>
  <text class="cell number" x="300" y="160">40</text>
  <text class="cell number" x="380" y="160">45</text>
  <text class="cell number" x="460" y="160">49</text>
  <text class="cell number" x="540" y="160">60</text>

  <rect y="176" width="580" height="44" fill="#d4d1d5"/>
  <text class="cell" x="20" y="203">Forward Smash (High)</text>
  <text class="cell number" x="220" y="203">63</text>
  <text class="cell number" x="300" y="203">63</text>
  <text class="cell number" x="380" y="203">69</text>
  <text class="cell number" x="460" y="203">75</text>
  <text class="cell number" x="540" y="203">89</text>
</svg>
