<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" role="img" aria-labelledby="title desc">
  <title id="title">LabRat text logo with subtitle</title>
  <desc id="desc">Minimal LabRat logo with the subtitle SSB64 Practice ROM below the underline.</desc>

  <defs>
    <style>
      .ink { fill:#171717; }
      .yellow { fill:#F6C90E; }
      .sub { fill:#444444; }
      .bar { fill:#171717; }
      .word { font-family: Arial, Helvetica, sans-serif; font-size:154px; font-weight:700; letter-spacing:-7px; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size:36px; font-weight:600; letter-spacing:3px; }
    </style>
  </defs>

  <g transform="translate(10 0)">
    <text x="0" y="165" class="word ink">Lab</text>
    <text x="272" y="165" class="word yellow">Rat</text>
    <rect x="5" y="198" width="505" height="12" rx="6" class="bar"/>
    <text x="258" y="268" text-anchor="middle" class="tag sub">SSB64 PRACTICE ROM</text>
  </g>
</svg>
